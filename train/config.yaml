# Training / quantization config (self-contained under train/)
# Put prepared parquet shards under data/ (e.g. data/prepared/train_fixed/*.parquet).

data:
  target_labels:
    - letter
    - form
    - email
    - resume
  num_workers: 4
  batch_size: 4
  seed: 42

augmentation:
  enabled: true
  rotation_degrees: 5.0
  translate_frac: 0.02
  scale_range: [0.95, 1.05]
  brightness: 0.15
  contrast: 0.2
  gauss_noise_var: 15.0
  apply_prob: 0.8

train:
  model_name: microsoft/layoutlmv3-base
  # Directory of fixed parquet shards. Val is always an 80/20 split of this corpus.
  train_parquet: data
  val_ratio: 0.2
  output_dir: outputs/layoutlmv3
  epochs: 3
  lr: 2.0e-5
  weight_decay: 0.01
  dropout: 0.1
  amp: true
  max_train_samples: null
  max_val_samples: null
  stage: 1
  encoder_checkpoint: null
  stage2_lr: 2.0e-4
  focal:
    gamma: 2.0
    alpha: 0.25

long_document:
  max_tokens: 512
  chunk_size: 400
  chunk_stride: 100
  max_chunks: 16
  stage: 1
  freeze_encoder: false
  mode_sampling: random_boxes  # random_boxes | random_window | head

output:
  label_threshold: 0.5
