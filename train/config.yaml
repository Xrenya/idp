data:
  target_labels:
    - letter
    - form
    - email
    - resume
  num_workers: 4
  batch_size: 4
  seed: 42

augmentation:
  enabled: true
  rotation_degrees: 5.0
  translate_frac: 0.02
  scale_range: [0.95, 1.05]
  brightness: 0.15
  contrast: 0.2
  gauss_noise_std_range: [0.0, 0.06]
  apply_prob: 0.8

train:
  model_name: microsoft/layoutlmv3-base
  # Validation data is split from these shards, I did not have time and storage to process it
  train_parquet: data
  val_ratio: 0.2
  output_dir: outputs/layoutlmv3
  epochs: 3
  lr: 2.0e-5
  weight_decay: 0.01
  dropout: 0.1
  amp: true
  max_train_samples: null
  max_val_samples: null
  stage: 1
  encoder_checkpoint: null
  stage2_lr: 2.0e-4
  focal:
    gamma: 2.0
    alpha: 0.25

long_document:
  # Stage 1: random sample (boxes or windows - well practically the same) (size=512) of each doc to max_tokens before encoding
  # Stage 2: generate max chunks (size = 16 X 400 = 6400), I did not inspect the dataset to set this number( 
  max_tokens: 512
  chunk_size: 400
  chunk_stride: 100
  max_chunks: 16
  stage: 1
  freeze_encoder: false
  mode_sampling: random_boxes

output:
  label_threshold: 0.5
